name: Bug report
description: Report a reproducible Apple-platform problem without sharing original game data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ISOs, extracted game assets, save files containing private information, signing material, or device identifiers.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone / Duo cover screen
        - iPhone / Duo inside screen
        - Physical iPad
        - macOS 11+ native app
        - Designed for iPad on Apple Vision Pro
        - Native visionOS Simulator prototype
        - Physical Apple Vision Pro native prototype
        - Other host/test build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
      description: For example 0.7.2 (702), or a commit hash
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the screen or mission, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch…
        2. Open…
        3. Tap…
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and OS version
      placeholder: iPhone Duo, iOS version; or iPad model, iPadOS version
  - type: dropdown
    id: graphics
    attributes:
      label: Graphics mode
      options:
        - Remastered
        - Original
        - Both
        - Unsure
  - type: textarea
    id: settings
    attributes:
      label: Settings and cheats
      description: Mention enabled cheats, Workshop preset, zoom, orientation, and whether the issue happens on a new mission or loaded save.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or gameplay video
      description: Drag images or a short video here. Include a timestamp for the glitch and say whether lag happens only at startup or continues.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, absolute container paths, device IDs, and signing details.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Data and privacy checks
      options:
        - label: I used supported C&C Gold GDI and Nod data that I am legally entitled to use.
          required: true
        - label: I did not attach original game data or private signing/device information.
          required: true
